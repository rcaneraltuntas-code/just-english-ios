name: JustEnglish
options:
  bundleIdPrefix: com.justenglishtr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: tr

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "74RD63B85K"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  JECore:
    path: Packages/JECore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.18.0"

targets:
  JustEnglish:
    type: application
    platform: iOS
    sources:
      - path: JustEnglish
      # HTML oyunları klasör olarak kopyalanır (alt klasör yapısı korunur).
      - path: WebGames
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justenglishtr.app
        INFOPLIST_FILE: JustEnglish/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: JustEnglish/JustEnglish.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: JECore
      - package: Supabase
        product: Supabase
      - package: LiveKit
        product: LiveKit

  JustEnglishTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JustEnglishTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JustEnglish
      - package: JECore

schemes:
  JustEnglish:
    build:
      targets:
        JustEnglish: all
    test:
      targets:
        - JustEnglishTests
